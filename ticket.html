<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ticket — Campus Event Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo">Campus<b>/</b>Hub</a>
      <div class="nav-links">
        <a href="index.html">Events</a>
        <a href="ticket.html" class="active">Ticket</a>
        <a href="admin.html">Admin</a>
        <button class="icon-btn" id="themeToggle" title="Switch light / dark">Light</button>
      </div>
    </div>
  </nav>

  <main class="container">
    <div class="form-wrap">
      <a href="index.html" class="back">← All events</a>

      <div class="form-card">
        <h1>Ticket check</h1>
        <p class="form-sub">Scanning a ticket's QR code opens this page. You can also type a ticket code below.</p>

        <form id="lookupForm" class="lookup">
          <input id="codeInput" placeholder="CH-XXXXXXXX" autocomplete="off" spellcheck="false">
          <button class="btn btn-ghost" type="submit">Check</button>
        </form>

        <div id="ticketResult"></div>
      </div>
    </div>
  </main>

  <footer><div class="container">Campus/Hub — Manipal University Jaipur</div></footer>

  <script src="js/vendor/qrcode.js"></script>
  <script src="data/fallback.js"></script>
  <script src="js/common.js"></script>
  <script src="js/ticket.js"></script>
</body>
</html>
